function chordLine(line,delta){const tokens=[...line.matchAll(/[A-G][#b]?(?:m|maj|sus|dim|aug|add)?\d*(?:\/[A-G][#b]?)?/g)];let out='',end=0;for(const t of tokens){out+=line.slice(end,t.index);const converted=t[0].replace(/[A-G][#b]?/g,n=>delta%12===0?n:['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][(pc[n]+delta+120)%12]);out+=converted;end=t.index+t[0].length;const difference=converted.length-t[0].length;if(difference>0&&line.slice(end,end+difference)===' '.repeat(difference))end+=difference;else if(difference<0)out+=' '.repeat(-difference)}return out+line.slice(end)}
